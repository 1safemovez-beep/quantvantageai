name: Build signed AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: twa
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Satisfy Bubblewrap SDK layout check
        run: |
          SDK_BIN="$(dirname "$(find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -1)")"
          ln -sfn "$SDK_BIN" "$ANDROID_SDK_ROOT/bin"
          ls "$ANDROID_SDK_ROOT/bin" | head -3

      - name: Configure Bubblewrap SDK paths
        run: |
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_SDK_ROOT" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json
          ls "$ANDROID_SDK_ROOT/build-tools" || true

      - name: Ensure build-tools 36.1.0
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "build-tools;36.1.0" > /dev/null 2>&1 || true
          ls "$ANDROID_SDK_ROOT/build-tools"

      - name: Restore keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android.keystore
          ls -la android.keystore

      - name: Build and sign AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: bubblewrap build --manifest ./twa-manifest.json

      - name: Verify signature
        run: "$ANDROID_SDK_ROOT/build-tools/36.1.0/apksigner verify --print-certs app-release-bundle.aab"

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: quantvantage-signed-aab
          path: twa/app-release-bundle.aab
