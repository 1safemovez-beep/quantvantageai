<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantVantage AI | Admin Dashboard</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .dashboard { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 20px; margin-bottom: 30px; gap: 20px; }
        .brand { display: flex; align-items: center; gap: 14px; }
        .brand h1 { margin: 0; }
        .brand-icon { width: 52px; height: 52px; color: #3E7096; flex-shrink: 0; }
        .header-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: #3E7096; color: white; padding: 20px; border-radius: 8px; text-align: center; }
        .stat-card h3 { margin: 0; font-size: 0.9rem; opacity: 0.8; }
        .stat-card div { font-size: 2rem; font-weight: bold; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; background: #eee; padding: 12px; border-bottom: 2px solid #ddd; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        .status { padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
        .status-paid { background: #d4edda; color: #155724; }
        .btn { background: #6F8854; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="header">
        <a class="brand" href="https://github.com/1safemovez-beep/quantvantageai" target="_blank" rel="noopener noreferrer" style="text-decoration: none; color: inherit;">
            <svg class="brand-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M50 5 L90 95 L10 95 Z" fill="none" stroke="currentColor" stroke-width="5" />
                <circle cx="50" cy="60" r="15" fill="currentColor" />
            </svg>
            <h1>QuantVantage AI Admin</h1>
        </a>
        <div class="header-actions">
            <a href="https://github.com/1safemovez-beep/quantvantageai" class="btn" target="_blank" rel="noopener noreferrer">Source Code</a>
            <a href="../marketing/landing_page.html" class="btn">View Live Site</a>
        </div>
    </div>

    <div class="stats">
        <div class="stat-card">
            <h3>Total Revenue</h3>
            <div>$499.00</div>
        </div>
        <div class="stat-card" style="background: #6F8854;">
            <h3>Active Reports</h3>
            <div>102</div>
        </div>
        <div class="stat-card" style="background: #C68E31;">
            <h3>Affiliate Clicks</h3>
            <div>452</div>
        </div>
    </div>

    <h2>Recent Transactions</h2>
    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Customer</th>
                <th>App Evaluated</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Aug 31, 2026</td>
                <td>j.doe@example.com</td>
                <td>AI Mall App</td>
                <td>$4.99</td>
                <td><span class="status status-paid">PAID</span></td>
                <td><button class="btn" style="background: #dc3545;" onclick="alert('Record deleted!')">Delete</button></td>
            </tr>
            <tr>
                <td>Aug 31, 2026</td>
                <td>a.smith@example.com</td>
                <td>Art AI Studio</td>
                <td>$4.99</td>
                <td><span class="status status-paid">PAID</span></td>
                <td><button class="btn" style="background: #dc3545;" onclick="alert('Record deleted!')">Delete</button></td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
